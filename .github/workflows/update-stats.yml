name: Mise à jour des stats Root-Me

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Configurer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le script Python
        env:
          ROOTME_API_KEY: ${{ secrets.ROOTME_API_KEY }}
        run: python update_stats.py

      - name: Sauvegarder et envoyer sur GitHub (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stats.json
          # S'il y a une différence, on commit et on push
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Stats Root-Me" && git push)